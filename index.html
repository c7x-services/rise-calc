<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bomj Rebirth — веб-трекер</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__brand">
        <h1>Bomj Rebirth</h1>
        <p class="muted">Заработок идёт, пока вкладка открыта</p>
      </div>
      <div class="header__accounts">
        <label class="sr-only" for="account-select">Аккаунт</label>
        <select id="account-select" class="select"></select>
        <button type="button" id="btn-rename-account" class="btn btn--ghost" title="Переименовать">✎</button>
        <button type="button" id="btn-add-account" class="btn btn--ghost" title="Новый аккаунт">+</button>
        <button type="button" id="btn-del-account" class="btn btn--ghost btn--danger" title="Удалить аккаунт">×</button>
      </div>
    </header>

    <main class="main">
      <section id="wizard" class="card wizard hidden">
        <div class="wizard__steps" id="wizard-steps">
          <span class="step step--active" data-step="0">1. Перерождение</span>
          <span class="step" data-step="1">2. Баланс</span>
          <span class="step" data-step="2">3. Заработок</span>
        </div>

        <div class="wizard__panel" id="panel-rebirth">
          <label for="input-rebirth">Текущее перерождение (0–37)</label>
          <input id="input-rebirth" class="input input--lg" type="number" min="0" max="37" step="1" inputmode="numeric" />
          <p class="hint" id="hint-rebirth"></p>
          <button type="button" class="btn btn--primary wizard-next">Далее</button>
        </div>

        <div class="wizard__panel hidden" id="panel-balance">
          <label for="input-balance">Баланс из игры</label>
          <input id="input-balance" class="input input--lg" type="text" placeholder="38.97K, 1.45M …" autocomplete="off" />
          <p class="hint">Отсюда пойдёт отсчёт времени до «Продолжить»</p>
          <div class="wizard__nav">
            <button type="button" class="btn btn--ghost wizard-back">Назад</button>
            <button type="button" class="btn btn--primary wizard-next">Далее</button>
          </div>
        </div>

        <div class="wizard__panel hidden" id="panel-earnings">
          <label for="input-earnings">Заработок / сек</label>
          <input id="input-earnings" class="input input--lg" type="text" placeholder="343.55, 100 …" autocomplete="off" />
          <p class="hint" id="hint-earnings-elapsed"></p>
          <div class="wizard__nav">
            <button type="button" class="btn btn--ghost wizard-back">Назад</button>
            <button type="button" class="btn btn--primary" id="btn-continue">Продолжить</button>
          </div>
        </div>

        <p class="error hidden" id="wizard-error"></p>
      </section>

      <section id="dashboard" class="dashboard hidden">
        <p class="error hidden" id="dashboard-error"></p>

        <div class="grid">
          <article class="card stat">
            <h2>Цель</h2>
            <p class="stat__value" id="stat-target">—</p>
            <div class="quick">
              <input id="edit-rebirth" class="input input--compact" type="number" min="0" max="37" step="1" title="Перерождение" />
              <button type="button" id="btn-apply-rebirth" class="btn btn--primary btn--sm">OK</button>
            </div>
          </article>

          <article class="card stat stat--wide">
            <h2>Баланс</h2>
            <p class="stat__value" id="stat-balance">—</p>
            <p class="muted" id="stat-balance-raw"></p>
            <div class="quick quick--stack">
              <input id="edit-balance" class="input input--compact input--grow" type="text" autocomplete="off" placeholder="из HUD, напр. 38.97K" />
              <div class="quick__btns">
                <button type="button" id="btn-set-balance" class="btn btn--primary btn--sm">OK</button>
                <button type="button" id="btn-reset-balance" class="btn btn--ghost btn--sm">Сброс</button>
              </div>
            </div>
            <div class="quick">
              <input id="edit-balance-sec" class="input input--compact input--sec" type="number" min="0" step="1" placeholder="N сек" />
              <button type="button" id="btn-sub-sec" class="btn btn--ghost btn--sm">−N</button>
              <button type="button" id="btn-add-sec" class="btn btn--primary btn--sm">+N</button>
            </div>
            <p class="hint hint--tight" id="hint-balance-sec">± заработок × N</p>
          </article>

          <article class="card stat">
            <h2>Заработок</h2>
            <p class="stat__value" id="stat-earnings">—</p>
            <p class="muted">+/с, пока вкладка открыта</p>
            <div class="quick">
              <input id="edit-earnings" class="input input--compact" type="text" autocomplete="off" placeholder="/сек" />
              <button type="button" id="btn-apply-earnings" class="btn btn--primary btn--sm">OK</button>
            </div>
          </article>

          <article class="card stat">
            <h2>Осталось</h2>
            <p class="stat__value" id="stat-remaining">—</p>
          </article>

          <article class="card stat stat--wide">
            <h2>ETA</h2>
            <div class="eta-row">
              <div class="eta-ring-wrap hidden" id="eta-ring-wrap">
                <svg class="eta-ring" viewBox="0 0 120 120" aria-hidden="true">
                  <circle class="eta-ring__track" cx="60" cy="60" r="52" />
                  <circle class="eta-ring__prog" id="eta-ring-prog" cx="60" cy="60" r="52" />
                </svg>
                <div class="eta-ring__label">
                  <span id="eta-ring-text">—</span>
                </div>
              </div>
              <div class="eta-copy">
                <p class="stat__value" id="stat-eta">—</p>
                <p class="muted" id="stat-eta-hint"></p>
              </div>
            </div>
          </article>

          <article class="card stat">
            <h2>Сессия</h2>
            <p class="stat__value" id="stat-session">—</p>
            <p class="muted" id="stat-session-detail"></p>
          </article>
        </div>
      </section>

      <aside class="card hints" id="hints-panel">
        <div class="hints__head">
          <h2>Подсказки: бизнесы</h2>
          <span class="badge" id="biz-badge">ROI</span>
        </div>
        <div class="hints__body" id="hints-body">
          <p class="muted" id="biz-status">Загрузка каталога…</p>
          <div id="biz-plan" class="biz-plan hidden"></div>
          <div class="biz-toolbar hidden" id="biz-toolbar">
            <label class="biz-check">
              <input type="checkbox" id="biz-show-maxed" />
              показать полностью купленные
            </label>
          </div>
          <div id="biz-list" class="biz-list hidden"></div>
        </div>
      </aside>
    </main>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
